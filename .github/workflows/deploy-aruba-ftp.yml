name: Deploy Magenta Stay to Aruba FTP

on:
  push:
    branches:
      - cursor/locazione-turistica-sanchioli-9e06
      - main
    paths:
      - "LocazioneTuristica/**"
      - ".github/workflows/deploy-aruba-ftp.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy LocazioneTuristica via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ARUBA_FTP_HOST }}
          username: ${{ secrets.ARUBA_FTP_USER }}
          password: ${{ secrets.ARUBA_FTP_PASSWORD }}
          local-dir: ./LocazioneTuristica/
          server-dir: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
          protocol: ftp
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/COPIA-SU-MAC*
            **/Foto/**
            **/.DS_Store
